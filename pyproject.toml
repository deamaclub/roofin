[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roofin"
version = "0.1.0"
description = "Finds local contractors losing leads online, proves it, and drafts a small paid fix offer."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0", "pydantic>=2"]
dev = ["pytest>=8"]

[project.scripts]
roofin = "roofin.cli:main"

[tool.setuptools.packages.find]
include = ["roofin*"]
